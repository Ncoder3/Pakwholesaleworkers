<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %} - Al Baraka</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Admin Styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">

    <!-- 1. CRITICAL SCRIPT IN HEAD: RUNS INSTANTLY BEFORE HTML PARSING -->
    <script>
        if (localStorage.getItem('sidebar_collapsed') === 'true') {
            document.documentElement.classList.add('sidebar-is-collapsed');
        }
    </script>

    <!-- 2. CRITICAL CSS IN HEAD: APPLIES COLLAPSED WIDTH IMMEDIATELY -->
    <style>
        /* Instant anti-flicker rules */
        html.sidebar-is-collapsed .sidebar {
            width: 72px !important;
        }

        html.sidebar-is-collapsed .sidebar .logo {
            flex-direction: column-reverse !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 16px 8px !important;
            gap: 12px !important;
        }

        html.sidebar-is-collapsed .sidebar .logo-text,
        html.sidebar-is-collapsed .sidebar .nav-link span,
        html.sidebar-is-collapsed .sidebar .nav-link div {
            display: none !important;
        }

        html.sidebar-is-collapsed .sidebar .nav-menu {
            padding: 12px 8px !important;
            align-items: center !important;
        }

        html.sidebar-is-collapsed .sidebar .nav-link {
            justify-content: center !important;
            padding: 0 !important;
            width: 48px !important;
            height: 48px !important;
            margin: 0 auto !important;
        }

        html.sidebar-is-collapsed .sidebar .nav-link i {
            min-width: auto !important;
        }

        /* Base Sidebar Layout Styles */
        .sidebar {
            width: 240px;
            background: var(--primary, #047857);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            min-height: 60px;
            gap: 12px;
        }

        .sidebar .logo-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            white-space: nowrap;
        }

        .sidebar-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .sidebar-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s ease, color 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .nav-link i {
            font-size: 18px;
            min-width: 22px;
            text-align: center;
        }

        /* Active & Hover states */
        .nav-link.active {
            background: rgba(0, 0, 0, 0.3) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .nav-link:hover {
            background: rgba(0, 0, 0, 0.15);
            color: #ffffff;
        }

        /* Dynamic Collapsed Rules */
        .sidebar.collapsed {
            width: 72px !important;
        }

        .sidebar.collapsed .logo {
            flex-direction: column-reverse !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 16px 8px !important;
            gap: 12px !important;
        }

        .sidebar.collapsed .logo-brand .logo-text,
        .sidebar.collapsed .nav-link span,
        .sidebar.collapsed .nav-link div {
            display: none !important;
        }

        .sidebar.collapsed .nav-menu {
            padding: 12px 8px !important;
            align-items: center !important;
        }

        .sidebar.collapsed .nav-link {
            justify-content: center !important;
            padding: 0 !important;
            width: 48px !important;
            height: 48px !important;
            margin: 0 auto !important;
        }

        .sidebar.collapsed .nav-link i {
            min-width: auto !important;
        }
    </style>
</head>
<body>
    <div class="wrapper" style="display: flex; min-height: 100vh;">
        <!-- Sidebar Navigation -->
        {% include "partials/sidebar.html" %}
        
        <!-- Main Content Panel -->
        <main class="main" style="flex: 1; display: flex; flex-direction: column; background: #f8fafc;">
            
            <!-- TOP HEADER BAR -->
            <header class="main-header" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: #ffffff; border-bottom: 1px solid #e2e8f0; position: relative;">
                
                <!-- Title Section -->
                <div>
                    <h1 style="font-size: 20px; font-weight: 700; color: #0f172a; margin: 0;">{% block page_title %}Dashboard{% endblock %}</h1>
                </div>

                <!-- Actions & Profile Group -->
                <div style="display: flex; align-items: center; gap: 16px;">
                    
                    <!-- Publish Live Button -->
                    <button type="button" onclick="publishLiveSite()" class="btn-publish-header" style="
                        display: inline-flex; 
                        align-items: center; 
                        gap: 8px; 
                        background: linear-gradient(135deg, #059669 0%, #10b981 100%); 
                        color: #ffffff; 
                        border: none; 
                        padding: 9px 18px; 
                        border-radius: 8px; 
                        font-weight: 600; 
                        font-size: 13px; 
                        cursor: pointer; 
                        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
                        transition: all 0.2s ease;">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 14px;"></i>
                        Publish to Live Site
                    </button>

                    <!-- Notification Bell & Dropdown Wrapper -->
                    <div style="position: relative;">
                        <button id="notificationBtn" onclick="toggleNotifications(event)" style="
                            background: #f8fafc; 
                            border: 1px solid #e2e8f0; 
                            border-radius: 50%; 
                            width: 40px; 
                            height: 40px; 
                            display: flex; 
                            align-items: center; 
                            justify-content: center; 
                            cursor: pointer;
                            position: relative;
                            transition: background 0.2s ease;">
                            <i class="fa-regular fa-bell" style="color: #64748b; font-size: 16px;"></i>
                            <!-- Dynamic Red Badge Indicator -->
                            <span id="notifBadge" style="
                                position: absolute; 
                                top: 2px; 
                                right: 2px; 
                                background: #ef4444; 
                                color: white; 
                                font-size: 10px; 
                                font-weight: 700; 
                                min-width: 16px; 
                                height: 16px; 
                                border-radius: 10px; 
                                padding: 0 4px;
                                display: none; 
                                align-items: center; 
                                justify-content: center;
                                border: 2px solid #ffffff;">0</span>
                        </button>

                        <!-- Notifications Dropdown Menu -->
                        <div id="notificationDropdown" style="
                            display: none; 
                            position: absolute; 
                            right: 0; 
                            top: 50px; 
                            width: 320px; 
                            background: #ffffff; 
                            border-radius: 12px; 
                            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
                            border: 1px solid #e2e8f0; 
                            z-index: 1000;
                            overflow: hidden;">
                            
                            <div style="padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-weight: 600; font-size: 13px; color: #1e293b;">Notifications</span>
                                <button onclick="markAllNotificationsRead()" style="background: none; border: none; color: #2563eb; font-size: 11px; font-weight: 600; cursor: pointer;">Mark all as read</button>
                            </div>

                            <div id="notifListContainer" style="max-height: 280px; overflow-y: auto;">
                                <div id="noNotifMessage" style="padding: 16px; text-align: center; color: #64748b; font-size: 12px;">No new order notifications.</div>
                            </div>
                        </div>
                    </div>

                    <!-- User Profile Badge -->
                    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 6px; border-radius: 20px; background: #f8fafc; border: 1px solid #e2e8f0;">
                        <div style="width: 32px; height: 32px; background: #a7f3d0; color: #065f46; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;">MN</div>
                        <div style="text-align: left;">
                            <div style="font-size: 13px; font-weight: 600; color: #0f172a; line-height: 1.2;">Muhammad Nouman</div>
                            <div style="font-size: 11px; color: #64748b;">Administrator</div>
                        </div>
                    </div>

                </div>
            </header>

            <!-- Page Content Body -->
            <div class="content-body" style="padding: 32px; flex: 1;">
                {% block content %}
                {% endblock %}
            </div>

        </main>
    </div>

    <!-- Main JavaScript File -->
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>

    <!-- 3. SIDEBAR TOGGLE & GLOBAL ORDER NOTIFICATION POLLING FUNCTIONALITY -->
    <script>
        // --- Sidebar Logic ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const sidebarIcon = document.getElementById('sidebarToggleIcon');
            const topbarIcon = document.getElementById('topbarToggleIcon');

            if (!sidebar) return;

            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');

            if (isCollapsed) {
                document.documentElement.classList.add('sidebar-is-collapsed');
            } else {
                document.documentElement.classList.remove('sidebar-is-collapsed');
            }

            if (sidebarIcon) {
                sidebarIcon.className = isCollapsed ? 'fa-solid fa-chevron-right' : 'fa-solid fa-chevron-left';
            }

            if (topbarIcon) {
                topbarIcon.className = isCollapsed ? 'fa-solid fa-indent' : 'fa-solid fa-bars';
            }

            localStorage.setItem('sidebar_collapsed', isCollapsed ? 'true' : 'false');
        }

        // --- Global Order Notification Engine ---
        let lastUnreadCount = 0;

        function checkUnreadOrders() {
            fetch('/api/orders/unread-count')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const count = data.unread_count || 0;
                        const webCount = data.website_count || 0;
                        const manualCount = data.manual_count || 0;

                        const notifBadge = document.getElementById('notifBadge');
                        const sidebarBadge = document.getElementById('sidebarOrdersBadge');
                        const sidebarWebBadge = document.getElementById('sidebarWebBadge');
                        const sidebarManualBadge = document.getElementById('sidebarManualBadge');
                        const notifList = document.getElementById('notifListContainer');

                        // 1. Update Top Bar Badge
                        if (notifBadge) {
                            if (count > 0) {
                                notifBadge.innerText = count;
                                notifBadge.style.display = 'flex';
                            } else {
                                notifBadge.style.display = 'none';
                            }
                        }

                        // 2. Update Sidebar Badges
                        if (webCount > 0 && sidebarWebBadge) {
                            sidebarWebBadge.innerText = `Web: ${webCount}`;
                            sidebarWebBadge.style.display = 'inline-block';
                        } else if (sidebarWebBadge) {
                            sidebarWebBadge.style.display = 'none';
                        }

                        if (manualCount > 0 && sidebarManualBadge) {
                            sidebarManualBadge.innerText = `Manual: ${manualCount}`;
                            sidebarManualBadge.style.display = 'inline-block';
                        } else if (sidebarManualBadge) {
                            sidebarManualBadge.style.display = 'none';
                        }

                        // Total Fallback Badge (shown when sources aren't split)
                        if (sidebarBadge) {
                            if (count > 0 && webCount === 0 && manualCount === 0) {
                                sidebarBadge.innerText = count;
                                sidebarBadge.style.display = 'inline-block';
                            } else {
                                sidebarBadge.style.display = 'none';
                            }
                        }

                        // 3. Dynamic Dropdown Item Generation
                        if (notifList) {
                            if (count > 0) {
                                let contentHtml = '';
                                if (webCount > 0) {
                                    contentHtml += `
                                        <div class="notif-item" style="padding: 12px 16px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 12px; align-items: flex-start; background: #f0f9ff;">
                                            <i class="fa-solid fa-globe" style="color: #0284c7; margin-top: 3px;"></i>
                                            <div>
                                                <div style="font-size: 12px; font-weight: 600; color: #0f172a;">Website Orders Received</div>
                                                <div style="font-size: 11px; color: #64748b; margin-top: 2px;">You have <strong>${webCount}</strong> new online order(s). <a href="/orders" style="color: #2563eb; font-weight: 600;">View Orders</a></div>
                                            </div>
                                        </div>`;
                                }
                                if (manualCount > 0) {
                                    contentHtml += `
                                        <div class="notif-item" style="padding: 12px 16px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 12px; align-items: flex-start; background: #fffbebfb;">
                                            <i class="fa-solid fa-pen-to-square" style="color: #d97706; margin-top: 3px;"></i>
                                            <div>
                                                <div style="font-size: 12px; font-weight: 600; color: #0f172a;">Manual / Dashboard Orders</div>
                                                <div style="font-size: 11px; color: #64748b; margin-top: 2px;">You have <strong>${manualCount}</strong> new manual order(s). <a href="/orders" style="color: #2563eb; font-weight: 600;">View Orders</a></div>
                                            </div>
                                        </div>`;
                                }
                                notifList.innerHTML = contentHtml;
                            } else {
                                notifList.innerHTML = `<div id="noNotifMessage" style="padding: 16px; text-align: center; color: #64748b; font-size: 12px;">No new order notifications.</div>`;
                            }
                        }

                        // 4. Audio Alert on New Orders
                        if (count > lastUnreadCount && lastUnreadCount !== 0) {
                            playAlertSound();
                        }

                        lastUnreadCount = count;
                    }
                })
                .catch(err => console.error('Error fetching order notifications:', err));
        }

        function playAlertSound() {
            const audio = new Audio('/static/sounds/notification.mp3');
            audio.play().catch(() => {});
        }

        function toggleNotifications(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('notificationDropdown');
            if (dropdown) {
                dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            }
        }

        function markAllNotificationsRead() {
            fetch('/api/orders/mark-read', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        checkUnreadOrders();
                    }
                });
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('notificationDropdown');
            const notifBtn = document.getElementById('notificationBtn');
            if (dropdown && notifBtn && !notifBtn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        // Initialize on load & start 10s polling interval
        document.addEventListener('DOMContentLoaded', () => {
            const isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
            const sidebar = document.getElementById('sidebar');

            if (isCollapsed && sidebar) {
                sidebar.classList.add('collapsed');
                
                const sidebarIcon = document.getElementById('sidebarToggleIcon');
                if (sidebarIcon) sidebarIcon.className = 'fa-solid fa-chevron-right';

                const topbarIcon = document.getElementById('topbarToggleIcon');
                if (topbarIcon) topbarIcon.className = 'fa-solid fa-indent';
            }

            checkUnreadOrders();
            setInterval(checkUnreadOrders, 10000);
        });
    </script>
</body>
</html>
