<aside class="sidebar" id="sidebar">
    <div class="logo">
        <button id="sidebarToggle" class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-chevron-left" id="sidebarToggleIcon"></i>
        </button>
        <div class="logo-brand">
            <i class="fa-solid fa-store"></i>
            <span class="logo-text">Al Baraka</span>
        </div>
    </div>

    <nav class="nav-menu">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>
        <a href="/products" class="nav-link {% if request.path == '/products' %}active{% endif %}">
            <i class="fa-solid fa-box"></i>
            <span>Products</span>
        </a>
        <a href="/inventory" class="nav-link {% if request.path == '/inventory' %}active{% endif %}">
            <i class="fa-solid fa-warehouse"></i>
            <span>Inventory</span>
        </a>
        <a href="/orders" class="nav-link {% if request.path == '/orders' %}active{% endif %}" style="position: relative;">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Orders</span>
            
            <!-- Source Badge Container -->
            <div style="margin-left: auto; display: flex; gap: 4px; align-items: center;">
                <!-- Website Badge -->
                <span id="sidebarWebBadge" title="Website Orders" style="
                    display: none; 
                    background: #0284c7; 
                    color: #ffffff; 
                    font-size: 10px; 
                    font-weight: 700; 
                    padding: 2px 6px; 
                    border-radius: 10px; 
                    line-height: 1;">W: 0</span>
                
                <!-- Manual / Dashboard Badge -->
                <span id="sidebarManualBadge" title="Dashboard/Manual Orders" style="
                    display: none; 
                    background: #d97706; 
                    color: #ffffff; 
                    font-size: 10px; 
                    font-weight: 700; 
                    padding: 2px 6px; 
                    border-radius: 10px; 
                    line-height: 1;">D: 0</span>

                <!-- Total Badge (Fallback if source not specified) -->
                <span id="sidebarOrdersBadge" style="
                    display: none; 
                    background: #ef4444; 
                    color: #ffffff; 
                    font-size: 11px; 
                    font-weight: 700; 
                    padding: 2px 7px; 
                    border-radius: 12px; 
                    line-height: 1;">0</span>
            </div>
        </a>
        <a href="/customers" class="nav-link {% if request.path == '/customers' %}active{% endif %}">
            <i class="fa-solid fa-users"></i>
            <span>Customers</span>
        </a>
        <a href="/analytics" class="nav-link {% if request.path == '/analytics' %}active{% endif %}">
            <i class="fa-solid fa-chart-line"></i>
            <span>Analytics</span>
        </a>
        <a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>
    </nav>
</aside>
