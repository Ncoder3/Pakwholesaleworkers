name: Remote Catalog Builder & Deploy

on:
  repository_dispatch:
    types: [remote_publish_trigger]

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r admin/requirements.txt

      - name: Run Catalog Generator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/generate.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "AlBaraka Automated Deployer"
          git config --global user.email "deploy@albarakatraders.com"

          git add output/

          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Auto-rebuilt catalog via remote publish trigger [skip ci]"
            git push origin main
          fi
      - name: Trigger Cloudflare Pages Build
        run: |
          curl -X POST -d "" "https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/104386dc-9021-47d6-ab4c-814b500405b0"
