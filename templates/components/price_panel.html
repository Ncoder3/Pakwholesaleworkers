<section class="panel price-panel">

    <span class="price-label">

        Price Per Piece

    </span>

    <div class="price">

        {{ price_per_piece }}

    </div>

    <div class="divider"></div>

    <div class="product-meta">

        <div class="meta-item">

            <div class="meta-icon">

                📦

            </div>

            <div>

                <span>

                    Packaging

                </span>

                <strong>

                    {{ packing }}

                </strong>

            </div>

        </div>

        <div class="meta-item">

            <div class="meta-icon">

                👥

            </div>

            <div>

                <span>

                    Pieces

                </span>

                <strong>

                    {{ pieces }}

                </strong>

            </div>

        </div>

    </div>

</section>
