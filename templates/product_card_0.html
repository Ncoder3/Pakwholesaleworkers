<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>{{ product_name }}</title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Card CSS -->

    <link
        rel="stylesheet"
        href="product_card_2.css">

</head>

<body
    style="
        --primary-color: {{ primary_color }};
        --secondary-color: {{ secondary_color }};
        --accent-color: {{ accent_color }};
        --text-color: {{ text_color }};
    ">

<div class="card">

    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <header class="header">

        <img
            class="logo"
            src="../assets/logo.png"
            alt="{{ brand }}">

        <div class="company">

            <h1>

                {{ brand }}

            </h1>

            <p>

                {{ tagline }}

            </p>

        </div>

    </header>

    <!-- ================================= -->
    <!-- PRODUCT IMAGE -->
    <!-- ================================= -->

    <section class="image-section">

        <div class="image-box">

            <img

                src="{{ image }}"

                alt="{{ product_name }}">

        </div>

    </section>
    <!-- ================================= -->
    <!-- PRODUCT INFORMATION -->
    <!-- ================================= -->

    <section class="product-info">

        <!-- Category Badge -->

        <div class="category-badge">

            {{ category }}

        </div>

        <!-- Product Name -->

        <h2 class="product-title">

            {{ product_name }}

        </h2>

    </section>

    <!-- ================================= -->
    <!-- PRICE + PRODUCT CODE -->
    <!-- ================================= -->

    <section class="price-section">

        <!-- Price Card -->

        <div class="price-card">

            <div class="price">

                Rs {{ price_per_piece }}

            </div>

            <div class="price-label">

                PER PIECE

            </div>

        </div>

        <!-- Product Code -->

        <div class="code-card">

            <div class="code">

                {{ product_code }}

            </div>

            <div class="code-label">

                PRODUCT CODE

            </div>

        </div>

    </section>

    <!-- ================================= -->
    <!-- PACKING INFORMATION -->
    <!-- ================================= -->

    <section class="packing-section">

        <div class="packing-box">

            📦

            <span>

                {{ packing }}

            </span>

            <span class="dot">

                •

            </span>

            <span>

                {{ pieces }} Pieces

            </span>

        </div>

    </section>
    <!-- ================================= -->
    <!-- QR / ORDER SECTION -->
    <!-- ================================= -->

    <section class="qr-section">

        <!-- QR Card -->

        <div class="qr-box">

            <img
                 class="qr-image"
                src="{{ qr }}"
                alt="QR Code">

        </div>

        <!-- Order Info -->

        <div class="order-info">

            <h3>

                Scan to Order

            </h3>

            <p>

                Scan this QR code to order instantly via WhatsApp.

            </p>

            <div class="product-reference">

                {{ product_code }}

            </div>

        </div>

    </section>

</div>

</body>

</html>
