<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>{{ product_name }}</title>

    <link
        rel="stylesheet"
        href="product_card_2.css">

    <style>

        :root{

            --primary-color: {{ primary_color }};
            --secondary-color: {{ secondary_color }};
            --accent-color: {{ accent_color }};
            --text-color: {{ text_color }};

        }

    </style>

</head>

<body>

    <div class="card">

        <!-- Decorative Background -->
        <div class="background-decoration">

            <div class="circle circle-1"></div>

            <div class="circle circle-2"></div>

            <svg
                class="background-wave"
                viewBox="0 0 1200 400"
                preserveAspectRatio="none">

                <path
                    d="M0,160 C250,260 500,60 800,160 C1000,230 1100,150 1200,200 L1200,0 L0,0 Z">
                </path>

            </svg>

        </div>

        <!-- Header -->
        {% include "components/header.html" %}

        <!-- Main Content -->
        <main class="main-grid">

            <!-- Left Side -->
            <section class="left-column">

                {% include "components/image_panel.html" %}

                {% include "components/info_panel.html" %}

            </section>

            <!-- Right Side -->
            <section class="right-column">

                {% include "components/price_panel.html" %}

                {% include "components/qr_panel.html" %}

            </section>

        </main>

        <!-- Bottom Features -->
        {% include "components/features_panel.html" %}

        <!-- Footer -->
        {% include "components/footer.html" %}

    </div>

</body>

</html>
