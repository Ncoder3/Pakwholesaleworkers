<section class="panel price-panel">
    <span class="price-label">Price Per Piece</span>
    <div class="price">Rs {{ price_per_piece }}</div>
    
    <div class="divider"></div>

    <div class="product-meta">
        <!-- Packaging Block -->
        <div class="meta-item">
            <div class="meta-icon-container">
                <svg class="meta-icon-svg" viewBox="0 0 24 24">
                    <path d="M20 8l-8-5-8 5v8l8 5 8-5V8zm-8-3.25L17.25 8 12 11.25 6.75 8 12 4.75zM5.5 9.5l5.75 3.6v6.15L5.5 15.65V9.5zm7.25 9.75v-6.15l5.75-3.6v6.15l-5.75 3.6z"/>
                </svg>
            </div>
            <div class="meta-text">
                <span>Packaging</span>
                <strong>{{ packing }}</strong>
            </div>
        </div>

        <!-- Pieces Block -->
        <div class="meta-item">
            <div class="meta-icon-container">
                <svg class="meta-icon-svg" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
            </div>
            <div class="meta-text">
                <span>Pieces</span>
                <strong>{{ pieces }}</strong>
            </div>
        </div>
    </div>
</section>
